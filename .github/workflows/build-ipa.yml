name: Build iOS IPA

# 从上游 https://github.com/DuarteSantos8/openGym 构建未签名 IPA。
# 等价于上游 .gitlab-ci.yml 里需要自建 Mac runner 的 build:ios 任务，
# 这里改用 GitHub Actions 的 macOS 托管 runner（公开仓库免费）。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 上游要构建的 tag / 分支（留空 = 最新 Release）
        required: false
        type: string
        default: ""
      force:
        description: 即使对应 Release 已存在也强制重新构建并覆盖产物
        required: false
        type: boolean
        default: false
      prerelease:
        description: 把 GitHub Release 标记为预发布
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "13 7 * * *" # 每天 15:13（北京时间）轮询一次上游新版本

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  check:
    name: 解析上游版本 / 判断是否需要构建
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      sha: ${{ steps.plan.outputs.sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      source_label: ${{ steps.plan.outputs.source_label }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: 计算要构建的 ref 与发布 tag
        id: plan
        env:
          # gh 自动回退使用 runner 内置的 GITHUB_TOKEN，无需显式设置 GH_TOKEN
          INPUT_REF: ${{ github.event.inputs.ref }}
          FORCE: ${{ github.event.inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # git ref 不含空白和引号，直接全部去掉（容错手动输入的引号/空格）
          REF=$(printf '%s' "$INPUT_REF" | tr -d " \t\r'\"")
          if [ -z "$REF" ]; then
            REF=$(gh api repos/DuarteSantos8/openGym/releases/latest --jq .tag_name)
            echo "未指定 ref，使用上游最新 Release: $REF"
          fi
          SHA=$(gh api "repos/DuarteSantos8/openGym/commits/$REF" --jq .sha)
          SHORT="${SHA:0:7}"
          case "$REF" in
            v*) RELEASE_TAG="$REF" ;;
            *)  RELEASE_TAG="$REF-$SHORT" ;;
          esac
          SOURCE_LABEL="$REF（$SHORT）"
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "Release $RELEASE_TAG 已存在，但 force=true，继续构建并覆盖产物"
            else
              echo "Release $RELEASE_TAG 已存在，跳过构建（可用 force 输入强制重建）"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "reason=Release $RELEASE_TAG 已存在" >> "$GITHUB_OUTPUT"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              echo "source_label=$SOURCE_LABEL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "reason=构建 $SOURCE_LABEL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_label=$SOURCE_LABEL" >> "$GITHUB_OUTPUT"

  build:
    name: macOS 构建未签名 IPA
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    env:
      UPSTREAM_REF: ${{ needs.check.outputs.sha }}
      SOURCE_LABEL: ${{ needs.check.outputs.source_label }}
    steps:
      - name: 签出上游 openGym
        uses: actions/checkout@v4
        with:
          repository: DuarteSantos8/openGym
          ref: ${{ env.UPSTREAM_REF }}

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确保 CocoaPods 可用
        run: command -v pod >/dev/null 2>&1 || brew install cocoapods

      - name: 构建移动端 Web 包（含 cap sync + pod install）
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build:mobile

      - name: xcodebuild 归档（无签名）
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          VER="$(node -p "require('../../package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' ../../android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "无法从 android/app/build.gradle 读取 versionCode" >&2; exit 1; }
          echo "MARKETING_VERSION=$VER" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD" >> "$GITHUB_ENV"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -60

      - name: 打包未签名 IPA + sha256
        run: |
          set -euo pipefail
          cd frontend/ios/App
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/openGym-$MARKETING_VERSION-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "openGym-$MARKETING_VERSION-unsigned.ipa" > "openGym-$MARKETING_VERSION-unsigned.ipa.sha256"
          cat "openGym-$MARKETING_VERSION-unsigned.ipa.sha256"

      - name: 生成 Release 说明
        env:
          SHA: ${{ needs.check.outputs.sha }}
          SOURCE_LABEL: ${{ needs.check.outputs.source_label }}
        run: |
          set -euo pipefail
          UP="https://github.com/DuarteSantos8/openGym"
          cat > release-body.md <<EOF
          本 Release 由 GitHub Actions 自动构建：源码为上游 [$SOURCE_LABEL]($UP/tree/$SHA)，构建方法与上游 \`.gitlab-ci.yml\` 的 \`build:ios\` 任务一致。

          **openGym-$MARKETING_VERSION-unsigned.ipa 是未签名 IPA**，不能直接双击安装，请先用以下任一方式签名（均为免费方案，详见本仓库 [README](https://github.com/$GITHUB_REPOSITORY/blob/main/README.md#安装方法)）：

          - **AltStore / AltServer**、**Sideloadly**：用你自己的免费 Apple ID 签名安装（7 天有效，需定期刷新）
          - **TrollStore**（受限 iOS 版本）：免签名直接安装，永久有效
          - **ESign**：手机端自签（需要导入自己的签名证书）

          应用安装后有两种模式：**本地模式**（免注册，数据在手机端）或连接你自己的 openGym 服务器（在已登录的浏览器里 设置 → 账户 → 「配对手持设备」生成一次性配对码，应用内输入服务器地址和配对码即可，应用内不需要 passkey）。

          - 上游版本：$SOURCE_LABEL（commit \`$SHA\`）
          - 校验：\`sha256sum -c openGym-$MARKETING_VERSION-unsigned.ipa.sha256\`
          - 上游构建：v$MARKETING_VERSION，build $CURRENT_PROJECT_VERSION；bundle id \`ch.duartesantos.opengym\`
          - 上游代码许可证：AGPL-3.0

          > 本仓库与 openGym 官方无关，只是把上游 iOS 构建搬到 GitHub Actions 上。
          EOF

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: openGym ${{ needs.check.outputs.release_tag }}（未签名 IPA）
          body_path: release-body.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            openGym-*-unsigned.ipa
            openGym-*-unsigned.ipa.sha256
          overwrite_files: true

      - name: 同时保留为 workflow 产物
        uses: actions/upload-artifact@v4
        with:
          name: openGym-${{ env.MARKETING_VERSION }}-unsigned-ipa
          path: |
            openGym-*-unsigned.ipa
            openGym-*-unsigned.ipa.sha256
          retention-days: 30
